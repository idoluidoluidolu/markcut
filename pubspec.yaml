name: markcut
description: "浮水印 - 浮水印與簡易剪輯工具"
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.1.0+18

environment:
  sdk: ^3.12.2

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  # Flutter 內建元件的字串（文字選單的貼上／全選／掃描文字、日期
  # 選擇器……）要顯示繁體中文，翻譯在這個套件裡。
  # 掛法見 main.dart 的 localizationsDelegates
  flutter_localizations:
    sdk: flutter

  # LGPL 版 FFmpeg：`_full` 是這一家八個套件裡「除了 GPL 元件
  # （x264／x265／xvid／vid.stab）以外全部都有」的建置，App Store 上架
  # 相容。沒有後綴的 ffmpeg_kit_flutter_new 是 Full-GPL 版——曾誤用到
  # 4.6.x，出貨的 libavcodec 裡帶著 x264/x265，跟這裡與 README 寫的
  # LGPL 不符，不要換回去。八個套件的 Dart API 一模一樣，只有 import
  # 路徑跟著套件名走（package:ffmpeg_kit_flutter_new_full/...）。
  # H.264 編碼用硬體（Android MediaCodec / iOS VideoToolbox）；
  # HDR→SDR 靠 zscale（libzimg，_full 有）＋tonemap（FFmpeg 原生）
  ffmpeg_kit_flutter_new_full: ^2.5.2
  video_player: ^2.13.0
  image_picker: ^1.2.3
  # 直接相依是為了打開 Android 的系統相簿選取器（見 main.dart）：
  # 預設關閉時走舊的 ACTION_GET_CONTENT，能不能多選要看是哪個
  # 相簿 App 接手，很多機型會變成只選得到一個
  image_picker_android: ^0.8.13
  gal: ^2.3.3
  shared_preferences: ^2.5.5
  path_provider: ^2.1.6
  web: ^1.1.1
  file_picker: 10.3.10
  # 錄音（旁白）
  record: ^6.1.2
  # 匯出期間螢幕不關（不然系統會凍結／回收 App，整批就斷在中間）
  wakelock_plus: ^1.5.2
  # Android 的預覽播放引擎（video_player 的 ExoPlayer 在 Pixel 上影格
  # 傳遞卡頓）。原生函式庫只帶 Android 的：iOS 沒有任何路徑會建 mpv
  # 播放器（PlayerX 在 iOS 一律走 AVPlayer），main.dart 的
  # MediaKit.ensureInitialized() 與偵測畫面的 mpv 步驟也都閘在
  # Android。少了 iOS 的 libs，media_kit_video 的 podspec 會自動改編
  # 它自帶的 stub 外掛（if mku.libs_found … else stub），不必動 ios/
  media_kit: ^1.1.11
  media_kit_video: ^1.2.5
  media_kit_libs_android_video: ^1.3.6
  http: ^1.6.0
  # 診斷報告的版本標（對版用）
  package_info_plus: ^9.0.0
  url_launcher: ^6.3.2
  in_app_purchase: ^3.2.0
  flutter_image_compress: ^2.5.1
  image_picker_platform_interface: ^2.11.1

# 自帶修改版的 iOS 播放外掛 video_player_avfoundation 2.11.0。不只一行
#（對 pub 快取 diff，每段都有「MarkCut patch」標記）：
#   FVPAVFactory.m  1 段：關掉 automaticallyWaitsToMinimizeStalling——那是
#     給串流用的「先等緩衝夠再播」，本機檔案純粹白等（首格 267ms+）
#   FVPVideoPlayer.m 5 段／+88 行：seek 世代號（丟掉過期的精修 seek）、
#     play 改 playImmediatelyAtRate（不等緩衝規則）、暫停中預捲解碼器、
#     拖曳時先寬容 seek 再排 250ms 後的精修、落點已在半格內就不精修。
#     其中 prerollAtRate 在 status != readyToPlay 會丟例外，補丁有 guard
# 上游正把 ObjC 改寫成 Swift（2.9.5 起），這些補丁沒辦法 rebase——升級
# video_player 時要逐段重做，不是只搬一行
dependency_overrides:
  video_player_avfoundation:
    path: packages/video_player_avfoundation
  # 自帶修改版的 file_picker 10.3.10（只動 iOS 的 FilePickerPlugin.m，
  # 每段都有「MarkCut patch」標記）：
  #   (1) PHPicker 回傳順序：上游把每個檔案「複製完成」的順序當回傳順序
  #       ——多選十支影片，大的、在 iCloud 的後到，時間軸就不是使用者
  #       點選的順序。改成照 PHPicker 給的（＝點選）順序填格子（依 index
  #       填槽、失敗槽剔除，三段）。11.0.x 上游一樣沒修
  #   (2) 複本位置：上游把每支挑到的影片/照片永久複製到
  #       Documents/picked_images（進 iCloud 備份、從沒人清）。改到
  #       tmp/picked_images 並標 NSURLIsExcludedFromBackupKey——草稿要留
  #       的素材 Dart 端自己複製，這份只是匯入中繼
  # 升級 file_picker 時記得把這四段搬過去
  file_picker:
    path: packages/file_picker

dev_dependencies:
  flutter_test:
    sdk: flutter
  # 模擬器上跑真手勢的整合測試（雲端 Mac 驗證迴圈用，不進成品）
  integration_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.3

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  image: ^4.9.2

# App 圖示：使用者的寶寶像素圖（三隻並排、由亮到暗）
#
# iOS 26 的 Liquid Glass 會自動幫「只有預設圖示」的 App 加上鏡面反光
# （邊緣呼吸感）。提供深色／單色變體後，系統改用我們給的圖，
# 深色模式下就是乾淨的純黑底
# 定版：像素幽靈第六版（icon_v6，淡色三隻放大到近滿版）。
# v4 的三隻只有 8~42% 不透明度，壓在白底上幾乎看不見，
# 遠看整顆糊成一塊灰——v5 把三階拉到 130/190/255，層次還在，
# 但白底才真的讀得出來是白
# 淺色模式吃白底那張；深色與單色變體吃透明那張——iOS 會把透明圖疊在
# 系統的深色底上，深色模式才是淺幽靈浮在暗底，而不是一塊白磚。
# app 內的 logo 同樣用透明版（home_logo）。
# 舊版 icon_v2 / icon.png 都留著，路徑改回即可還原
flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true # App Store 圖示不能帶透明通道
  image_path: "assets/icon/icon_v8.png"
  # 深色模式也用白底那張：使用者要求圖示背景一律白色
  image_path_ios_dark_transparent: "assets/icon/icon_v8.png"
  image_path_ios_tinted_grayscale: "assets/icon/icon_v8_trans.png"
  desaturate_tinted_to_grayscale_ios: true
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/icon_v8_trans.png"
  web:
    generate: true
    image_path: "assets/icon/icon_v8.png"
    background_color: "#FFFFFF"
    theme_color: "#FFFFFF"

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  assets:
    - assets/icon/home_logo.png
    # Web 展示模式用的內建 GIF 範例（見 GifStore.demoRefs）
    - assets/demo/

  shaders:
    - shaders/mosaic.frag

  fonts:
    # UI 字體。原本這幾個檔案是「可變字體」，而它們的預設實例是
    # Thin(100)／ExtraLight(200)——Flutter 不會自己把 fontWeight 套到
    # wght 軸，所以實機上整個 App 都用最細的那一階在畫，字看起來很單薄
    # （網頁版正常是因為瀏覽器換成自己的字體）。
    # 已經用 fontTools 烘成固定字重的靜態字體，順便去掉 gvar 變小了。
    # 要改字重就重新烘一份，不要換回可變字體
    - family: NotoSansTC
      fonts:
        - asset: assets/fonts/NotoSansTC.ttf
          weight: 400
        - asset: assets/fonts/NotoSansTC-Bold.ttf
          weight: 700
    - family: NotoSerifTC
      fonts:
        - asset: assets/fonts/NotoSerifTC.ttf
    - family: OpenHuninn
      fonts:
        - asset: assets/fonts/jf-openhuninn.ttf
    - family: Montserrat
      fonts:
        - asset: assets/fonts/Montserrat.ttf
    - family: PlayfairDisplay
      fonts:
        - asset: assets/fonts/PlayfairDisplay.ttf
    - family: Pacifico
      fonts:
        - asset: assets/fonts/Pacifico.ttf
    - family: BebasNeue
      fonts:
        - asset: assets/fonts/BebasNeue.ttf
    - family: LXGWWenKaiTC
      fonts:
        - asset: assets/fonts/LXGWWenKaiTC.ttf
    - family: Oswald
      fonts:
        - asset: assets/fonts/Oswald.ttf
    - family: Lobster
      fonts:
        - asset: assets/fonts/Lobster.ttf
    - family: Anton
      fonts:
        - asset: assets/fonts/Anton.ttf
    - family: CourierPrime
      fonts:
        - asset: assets/fonts/CourierPrime.ttf
    # 第二批英文（使用者指定）：挑現有九種沒有的類型——圓潤無襯線、
    # 現代無襯線、展示襯線、花體、手寫麥克筆、像素。Google Fonts 給的是
    # 可變字體，跟上面 NotoSansTC 同一個理由（Flutter 不會把 fontWeight
    # 套到 wght 軸）用 fontTools 烘成固定字重的靜態檔
    - family: Quicksand
      fonts:
        - asset: assets/fonts/Quicksand.ttf
    - family: SpaceGrotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk.ttf
    - family: AbrilFatface
      fonts:
        - asset: assets/fonts/AbrilFatface.ttf
    - family: DancingScript
      fonts:
        - asset: assets/fonts/DancingScript.ttf
    - family: Caveat
      fonts:
        - asset: assets/fonts/Caveat.ttf
    - family: PressStart2P
      fonts:
        - asset: assets/fonts/PressStart2P.ttf
    # 第二批中文（使用者從十個候選裡挑的兩個）。原檔 15 MB／7 MB，
    # 子集化到整個 Big5 字集（1.3 萬字＋ASCII＋標點）才放進來——只留
    # 常用字的話，人名地名裡的次常用字會退回思源黑體，一句話兩種字型。
    # 不在 Big5 裡的字（簡體、日文假名）一樣會退回思源黑體
    - family: Yozai
      fonts:
        - asset: assets/fonts/Yozai.ttf
    - family: FusionPixel
      fonts:
        - asset: assets/fonts/FusionPixel.ttf

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
