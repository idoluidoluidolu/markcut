# Codemagic 雲端建置：iOS → TestFlight
#
# 簽章流程（Codemagic 官方手動流程）：
#   fetch-signing-files --create 用 CERTIFICATE_PRIVATE_KEY（安全變數）
#   在 Apple 端自動建立 Apple Distribution 憑證＋App Store 描述檔。
#   ⚠ 自動模式（ios_signing）只會「抓」現有描述檔、不會建——
#     帳號還沒有簽章檔時會報 No matching profiles found
#
# 前置（一次性）：
# 1. Apple Developer Portal 已註冊 App ID：com.idoluidoluidolu.watermark
# 2. App Store Connect 已建立對應的 App
# 3. Codemagic → Integrations → App Store Connect：名稱「watermark」
# 4. Codemagic 的 App settings → Environment variables：
#    群組 appstore，變數 CERTIFICATE_PRIVATE_KEY（勾 Secure），
#    值＝專案根目錄 ios_cert_key.pem 的完整內容
#
# 版號（build number）只有一個來源：Codemagic 的 $PROJECT_BUILD_NUMBER
#（整個 App 共用的遞增計數器，每次建置 +1，三條 workflow 都看得到）。
# pubspec.yaml 的 `version: 1.1.0+18` 那個 +18 只給本機 flutter build 用；
# 雲端的 iOS 與 Android 都用 --build-number 蓋掉它，兩平台的
# CFBundleVersion／versionCode 才是同一條數線（之前 iOS 走 Codemagic
# 計數、Android 走 pubspec，兩邊各說各話）。版本名 1.1.0 仍以 pubspec 為準。
#
# Flutter 版本釘死在 3.44.8（本機同版）：stable/latest 浮動，
# 升版會無聲改變行為，出了事對不回本機

# 共用步驟（YAML 錨點）：兩條 iOS workflow 在編譯前都先跑
definitions:
  scripts:
    - &analyze
      name: 靜態檢查
      script: dart analyze lib test
    - &test
      name: 測試（全套）
      script: |
        # 管線裡不能信 flutter test 的失敗碼（本機踩過多次：吞失敗碼、
        # 半路崩潰卻回 0）。改看輸出：一個 [E] 都不能有，而且
        # 一定要看到 "All tests passed"，兩個條件缺一就擋下
        #
        # --exclude-tags golden：畫面快照這裡不跑。那些 PNG 是在本機
        # （Windows）產生的，這台是 macOS，Flutter 引擎各平台各自編、
        # 反鋸齒對不起來，跨平台比對必紅——這道關卡第一次真的跑就是
        # 栽在這裡：11 支 golden 全紅、其餘 735 條全過。
        # 本機 `flutter test` 照跑不變，版面回歸要在改版當下就被擋住，
        # 那才是快照真正在用的地方，不是等到 CI
        flutter test --no-pub --exclude-tags golden > test_ci.log 2>&1 || true
        tail -n 40 test_ci.log
        if grep -q "\[E\]" test_ci.log; then
          echo "❌ 死因：有測試失敗（[E]）"
          grep -n "\[E\]" test_ci.log | head -n 30
          exit 1
        fi
        if ! grep -q "All tests passed" test_ci.log; then
          echo "❌ 死因：沒看到 All tests passed（測試沒跑完或半路崩潰）"
          exit 1
        fi

workflows:
  ios-testflight:
    name: iOS → TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: watermark
    environment:
      groups:
        - appstore # 內含 CERTIFICATE_PRIVATE_KEY
      vars:
        BUNDLE_ID: "com.idoluidoluidolu.watermark"
      flutter: 3.44.8
      xcode: latest
      cocoapods: default
    scripts:
      - name: 1 抓取／建立簽章檔
        script: |
          if [ -z "$CERTIFICATE_PRIVATE_KEY" ]; then
            echo "❌ 死因：CERTIFICATE_PRIVATE_KEY 環境變數不存在"
            echo "   → Codemagic App settings → Environment variables"
            echo "     群組名稱 appstore、變數勾 Secure"
            exit 1
          fi
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create
          keychain add-certificates
      - name: 2 驗證簽章檔真的存在
        script: |
          echo "=== 憑證（keychain）==="
          security find-identity -v -p codesigning || true
          P1="$HOME/Library/MobileDevice/Provisioning Profiles"
          P2="$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
          C1=$(ls "$P1"/*.mobileprovision 2>/dev/null | wc -l | tr -d ' ')
          C2=$(ls "$P2"/*.mobileprovision 2>/dev/null | wc -l | tr -d ' ')
          TOTAL=$((C1 + C2))
          echo "描述檔數量：$TOTAL"
          if [ "$TOTAL" -eq 0 ]; then
            echo "❌ 死因：沒有描述檔（fetch --create 失敗）"
            exit 1
          fi
          if ! security find-identity -v -p codesigning | grep -q "Apple Distribution"; then
            echo "❌ 死因：keychain 裡沒有 Apple Distribution 憑證"
            exit 1
          fi
      - name: 3 Flutter 依賴
        script: flutter pub get
      - *analyze
      - *test
      - name: 4 CocoaPods
        script: |
          cd ios
          pod install
      - name: 5 編譯（不簽章）
        script: |
          flutter build ios --release --no-codesign \
            --build-number=$PROJECT_BUILD_NUMBER
      # use-profiles 必須緊貼封裝：flutter build ios 內部會重跑
      # pod install，會把先套好的簽章設定洗掉
      - name: 6 套用描述檔並驗證
        script: |
          xcode-project use-profiles
          if ! grep -q "PROVISIONING_PROFILE_SPECIFIER" \
              ios/Runner.xcodeproj/project.pbxproj; then
            echo "❌ 死因：use-profiles 沒把描述檔寫進 Xcode 專案"
            grep -n "PRODUCT_BUNDLE_IDENTIFIER" \
              ios/Runner.xcodeproj/project.pbxproj
            exit 1
          fi
      - name: 7 封裝 IPA
        script: |
          xcode-project build-ipa \
            --workspace ios/Runner.xcworkspace \
            --scheme Runner
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - test_ci.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true

  # 快速編譯檢查：不簽章、不上傳，只驗 Swift/Dart 編得過。
  # 給 AI 助手的迴圈用：push 之後用 Codemagic API 觸發這條，
  # ~10 分鐘拿到編譯錯誤自己修，不用等 TestFlight 整條跑完、
  # 也不用真機測試員當編譯器。
  # analyze＋全套測試也掛在這裡（本機實測全套約 3 分鐘）：
  # 編得過但測試紅的 push 一樣要在這條被擋下
  ios-compile:
    name: iOS 編譯檢查（不簽章）
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      flutter: 3.44.8
      xcode: latest
      cocoapods: default
    scripts:
      - name: Flutter 依賴
        script: flutter pub get
      - *analyze
      - *test
      - name: CocoaPods
        script: |
          cd ios
          pod install
      - name: 編譯（不簽章）
        script: |
          flutter build ios --release --no-codesign \
            --build-number=$PROJECT_BUILD_NUMBER
    artifacts:
      - test_ci.log

  # Android：產出 release APK 當備份（可選）
  android-apk:
    name: Android APK
    instance_type: linux_x2
    max_build_duration: 45
    environment:
      flutter: 3.44.8
      java: 17
    scripts:
      - name: Flutter 依賴
        script: flutter pub get
      # versionCode 跟 iOS 同一個計數器（見檔頭），不用 pubspec 的 +18
      - name: 建置 APK
        script: |
          flutter build apk --release --split-per-abi \
            --build-number=$PROJECT_BUILD_NUMBER
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
