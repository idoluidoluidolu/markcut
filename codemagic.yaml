# Codemagic 雲端建置：iOS → TestFlight
#
# 前置（一次性）：
# 1. App Store Connect 已建 App，Bundle ID：com.idoluidoluidolu.watermark
# 2. Codemagic → Integrations → App Store Connect：
#    integration 名稱「watermark」，API 金鑰角色需 App Manager/Admin
# 3. Start new build → ios-testflight
#
# 流程採「每站硬驗證」：任何一站的產出缺失就立刻失敗並印出死因，
# 不讓問題漂到後面的站才爆
workflows:
  ios-testflight:
    name: iOS → TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: watermark
    environment:
      vars:
        BUNDLE_ID: "com.idoluidoluidolu.watermark"
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: 1 抓取／建立簽章檔
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create
          keychain add-certificates
      - name: 2 驗證簽章檔真的存在
        script: |
          echo "=== 憑證（keychain）==="
          security find-identity -v -p codesigning || true
          P1="$HOME/Library/MobileDevice/Provisioning Profiles"
          P2="$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
          echo "=== 描述檔（舊路徑）==="; ls -la "$P1" 2>/dev/null || echo "(空)"
          echo "=== 描述檔（Xcode 16+ 路徑）==="; ls -la "$P2" 2>/dev/null || echo "(空)"
          C1=$(ls "$P1"/*.mobileprovision 2>/dev/null | wc -l | tr -d ' ')
          C2=$(ls "$P2"/*.mobileprovision 2>/dev/null | wc -l | tr -d ' ')
          TOTAL=$((C1 + C2))
          echo "描述檔數量：$TOTAL"
          if [ "$TOTAL" -eq 0 ]; then
            echo "❌ 死因：fetch-signing-files 沒抓到也沒建立任何描述檔"
            echo "   最可能：API 金鑰角色不是 App Manager/Admin，"
            echo "   或 Apple Developer Portal 沒有這個 Bundle ID 的 App ID"
            exit 1
          fi
          if ! security find-identity -v -p codesigning | grep -q "Apple Distribution"; then
            echo "❌ 死因：keychain 裡沒有 Apple Distribution 發布憑證"
            exit 1
          fi
      - name: 3 Flutter 依賴
        script: flutter pub get
      - name: 4 CocoaPods
        script: |
          cd ios
          pod install
      - name: 5 編譯（不簽章）
        script: |
          flutter build ios --release --no-codesign \
            --build-number=$PROJECT_BUILD_NUMBER
      # use-profiles 必須緊貼封裝：flutter build ios 內部會重跑
      # pod install，會把先套好的簽章設定洗掉
      - name: 6 套用描述檔並驗證
        script: |
          xcode-project use-profiles
          echo "=== 專案內的簽章設定 ==="
          grep -n "PROVISIONING_PROFILE_SPECIFIER\|DEVELOPMENT_TEAM\|CODE_SIGN_IDENTITY" \
            ios/Runner.xcodeproj/project.pbxproj || true
          if ! grep -q "PROVISIONING_PROFILE_SPECIFIER" \
              ios/Runner.xcodeproj/project.pbxproj; then
            echo "❌ 死因：use-profiles 沒把描述檔寫進 Xcode 專案"
            echo "   （描述檔的 Bundle ID 跟專案對不上？下面是專案的識別碼）"
            grep -n "PRODUCT_BUNDLE_IDENTIFIER" \
              ios/Runner.xcodeproj/project.pbxproj
            exit 1
          fi
      - name: 7 封裝 IPA
        script: |
          xcode-project build-ipa \
            --workspace ios/Runner.xcworkspace \
            --scheme Runner
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true

  # Android：產出 release APK 當備份（可選）
  android-apk:
    name: Android APK
    instance_type: linux_x2
    max_build_duration: 45
    environment:
      flutter: stable
      java: 17
    scripts:
      - name: Flutter 依賴
        script: flutter pub get
      - name: 建置 APK
        script: flutter build apk --release --split-per-abi
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
