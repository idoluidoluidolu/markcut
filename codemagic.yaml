# Codemagic 雲端建置：iOS → TestFlight
#
# 簽章採全自動模式（ios_signing）：憑證與描述檔由 Codemagic
# 透過 App Store Connect integration 自動建立與管理，
# 包含它內部保管的憑證私鑰——不要改成手動 fetch-signing-files，
# 那條路需要另外提供 CERTIFICATE_PRIVATE_KEY，缺了就會
# 「Cannot save Signing Certificates without certificate private key」
#
# 前置（一次性）：
# 1. Apple Developer Portal 已註冊 App ID：com.idoluidoluidolu.watermark
# 2. App Store Connect 已建立對應的 App
# 3. Codemagic → Integrations → App Store Connect：
#    integration 名稱「watermark」，API 金鑰角色 App Manager/Admin
workflows:
  ios-testflight:
    name: iOS → TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: watermark
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.idoluidoluidolu.watermark
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: 1 驗證自動簽章已就緒
        script: |
          echo "=== 憑證（keychain）==="
          security find-identity -v -p codesigning || true
          echo "=== export_options.plist ==="
          if [ ! -f /Users/builder/export_options.plist ]; then
            echo "❌ 死因：自動簽章沒有產生 export_options.plist"
            echo "   → 檢查 ios_signing 區塊與 integration 權限"
            exit 1
          fi
          cat /Users/builder/export_options.plist
      - name: 2 Flutter 依賴
        script: flutter pub get
      - name: 3 CocoaPods
        script: |
          cd ios
          pod install
      - name: 4 建置 IPA
        script: |
          flutter build ipa --release \
            --build-number=$PROJECT_BUILD_NUMBER \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true

  # Android：產出 release APK 當備份（可選）
  android-apk:
    name: Android APK
    instance_type: linux_x2
    max_build_duration: 45
    environment:
      flutter: stable
      java: 17
    scripts:
      - name: Flutter 依賴
        script: flutter pub get
      - name: 建置 APK
        script: flutter build apk --release --split-per-abi
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
