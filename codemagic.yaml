# Codemagic 雲端建置：iOS → TestFlight
#
# 前置（一次性，都在網站上做）：
# 1. codemagic.io 用 GitHub 登入，加入這個 repo
# 2. App Store Connect 已建立 App，Bundle ID：com.idoluidoluidolu.watermark
# 3. App Store Connect → 使用者與存取 → 整合 → App Store Connect API
#    建立金鑰（角色需 App Manager 或 Admin），下載 .p8
# 4. Codemagic → Teams → Integrations → App Store Connect
#    貼上 Issuer ID / Key ID / .p8，integration 名稱取「watermark」
# 5. Start new build → 選 ios-testflight
workflows:
  ios-testflight:
    name: iOS → TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: watermark # ← 對應 Codemagic 上的 integration 名稱
    environment:
      vars:
        BUNDLE_ID: "com.idoluidoluidolu.watermark"
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      # 簽章：--create 會在憑證/描述檔不存在時自動建立
      # （不要再用 ios_signing 區塊，那只會抓現有的、不會建）
      - name: 抓取／建立簽章檔
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create
          keychain add-certificates
          echo "=== 已安裝的簽章憑證 ==="
          security find-identity -v -p codesigning
          echo "=== 已下載的描述檔 ==="
          ls -la "$HOME/Library/MobileDevice/Provisioning Profiles/" || true
      - name: Flutter 依賴
        script: flutter pub get
      - name: CocoaPods
        script: |
          cd ios
          pod install
      # 兩段式建置：flutter 只編譯不簽章，簽章交給 xcode-project
      # （flutter build ipa 會去找「開發憑證」，但我們只有發布憑證，
      #   直接用會失敗：No development certificates available）
      # PROJECT_BUILD_NUMBER 由 Codemagic 遞增，避免 TestFlight 拒收重複編號
      - name: 編譯（不簽章）
        script: |
          flutter build ios --release --no-codesign \
            --build-number=$PROJECT_BUILD_NUMBER
      # use-profiles 與 build-ipa 必須綁在一起：
      # pod install（flutter build ios 內部也會跑）會重寫 Xcode 專案設定，
      # 中間插任何步驟都會把簽章設定洗掉 → requires a provisioning profile
      - name: 套用描述檔＋封裝 IPA
        script: |
          xcode-project use-profiles
          echo "=== 專案簽章設定 ==="
          xcodebuild -workspace ios/Runner.xcworkspace -scheme Runner \
            -showBuildSettings 2>/dev/null \
            | grep -E "CODE_SIGN_STYLE|PROVISIONING_PROFILE|DEVELOPMENT_TEAM|CODE_SIGN_IDENTITY" \
            || true
          xcode-project build-ipa \
            --workspace ios/Runner.xcworkspace \
            --scheme Runner
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true

  # Android：產出 release APK 當備份（可選）
  android-apk:
    name: Android APK
    instance_type: linux_x2
    max_build_duration: 45
    environment:
      flutter: stable
      java: 17
    scripts:
      - name: Flutter 依賴
        script: flutter pub get
      - name: 建置 APK
        script: flutter build apk --release --split-per-abi
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
